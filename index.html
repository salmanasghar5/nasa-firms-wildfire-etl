<style>
:root {
  --bg: #f4f6fb;
  --panel: rgba(255, 255, 255, 0.92);
  --line: rgba(15, 23, 42, 0.08);
  --line-strong: rgba(15, 23, 42, 0.14);
  --accent: #2563eb;
  --accent-glow: rgba(37, 99, 235, 0.25);
  --cyan: #0284c7;
  --emerald: #059669;
  --amber: #d97706;
  --red: #dc2626;
  --text: #0f172a;
  --muted: #64748b;
  --font-ui: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --ease-spring: cubic-bezier(0.22, 1, 0.36, 1);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  background-image:
    radial-gradient(at 15% 10%, rgba(37, 99, 235, 0.06) 0px, transparent 45%),
    radial-gradient(at 85% 90%, rgba(2, 132, 199, 0.06) 0px, transparent 45%);
  color: var(--text);
  font-family: var(--font-ui);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

/* =========================================================
   1. HEAVY ORBITAL SATELLITE BOOT SEQUENCE
   ========================================================= */
#bootScreen {
  position: fixed;
  inset: 0;
  background: radial-gradient(circle at center, #0b132b 0%, #030712 100%);
  z-index: 9999;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transition: opacity 0.85s var(--ease-spring), transform 0.85s var(--ease-spring), visibility 0.85s;
}
#bootScreen.dismissed {
  opacity: 0;
  transform: scale(1.06);
  visibility: hidden;
  pointer-events: none;
}

.orbital-stage {
  position: relative;
  width: 220px;
  height: 220px;
  display: grid;
  place-items: center;
}

.ring-outer {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 1.5px dashed rgba(56, 189, 248, 0.35);
  animation: orbitCW 10s linear infinite;
}
.ring-mid {
  position: absolute;
  inset: 26px;
  border-radius: 50%;
  border: 2px solid transparent;
  border-top-color: #38bdf8;
  border-bottom-color: #818cf8;
  box-shadow: 0 0 25px rgba(56, 189, 248, 0.25);
  animation: orbitCCW 4.5s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
}
.ring-inner {
  position: absolute;
  inset: 54px;
  border-radius: 50%;
  border: 1px solid rgba(244, 63, 94, 0.45);
  animation: orbitCW 6s linear infinite;
}

.sat-carrier {
  position: absolute;
  inset: -6px;
  animation: orbitCW 5s linear infinite;
}
.sat-badge {
  position: absolute;
  top: -14px;
  left: 50%;
  transform: translateX(-50%);
  width: 34px;
  height: 34px;
  border-radius: 10px;
  background: rgba(15, 23, 42, 0.9);
  border: 1px solid rgba(56, 189, 248, 0.6);
  box-shadow: 0 0 20px rgba(56, 189, 248, 0.6);
  display: grid;
  place-items: center;
  font-size: 16px;
  animation: orbitCCW 5s linear infinite;
}

.planet-core {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, #38bdf8, #1d4ed8 65%, #0f172a 100%);
  box-shadow: 0 0 40px rgba(37, 99, 235, 0.65), inset 0 0 18px rgba(255, 255, 255, 0.35);
  position: relative;
  display: grid;
  place-items: center;
  animation: coreBreathe 2.2s ease-in-out infinite alternate;
}
.thermal-ping {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #f43f5e;
  box-shadow: 0 0 14px #f43f5e;
  animation: hotspotPulse 1.1s ease-out infinite;
}

.boot-hud {
  margin-top: 32px;
  text-align: center;
  width: 340px;
}
.boot-title {
  color: #f8fafc;
  font-weight: 700;
  font-size: 14px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  margin-bottom: 8px;
}
.boot-logs {
  font-family: var(--font-mono);
  font-size: 11px;
  color: #38bdf8;
  letter-spacing: 0.04em;
  min-height: 18px;
}
.boot-bar-track {
  margin-top: 14px;
  height: 3px;
  width: 100%;
  background: rgba(255, 255, 255, 0.1);
  border-radius: 99px;
  overflow: hidden;
}
.boot-bar-fill {
  height: 100%;
  width: 10%;
  background: linear-gradient(90deg, #38bdf8, #818cf8, #f43f5e);
  transition: width 0.35s ease;
}

@keyframes orbitCW { 100% { transform: rotate(360deg); } }
@keyframes orbitCCW { 100% { transform: rotate(-360deg); } }
@keyframes coreBreathe {
  0% { transform: scale(0.95); }
  100% { transform: scale(1.05); }
}
@keyframes hotspotPulse {
  0% { transform: scale(0.8); opacity: 1; box-shadow: 0 0 0 0 rgba(244, 63, 94, 0.8); }
  100% { transform: scale(1.4); opacity: 0.4; box-shadow: 0 0 0 18px rgba(244, 63, 94, 0); }
}

/* =========================================================
   2. MAIN AI CONTROL LAYOUT & SPRING ANIMATIONS
   ========================================================= */
.layout {
  display: flex;
  min-height: 100vh;
  opacity: 0;
  transform: translateY(14px);
  transition: opacity 0.85s var(--ease-spring), transform 0.85s var(--ease-spring);
}
.layout.visible {
  opacity: 1;
  transform: translateY(0);
}

.sidebar {
  width: 76px;
  position: fixed;
  inset: 0 auto 0 0;
  background: rgba(255, 255, 255, 0.85);
  backdrop-filter: blur(16px);
  border-right: 1px solid var(--line);
  display: flex;
  align-items: center;
  flex-direction: column;
  padding: 18px 0;
  gap: 10px;
  z-index: 1000;
}

.logo {
  width: 44px;
  height: 44px;
  border-radius: 14px;
  display: grid;
  place-items: center;
  background: linear-gradient(135deg, #2563eb, #0284c7);
  color: #ffffff;
  font-size: 18px;
  font-weight: 800;
  margin-bottom: 20px;
  box-shadow: 0 8px 20px -4px rgba(37, 99, 235, 0.45);
  transition: transform 0.3s var(--ease-spring);
}
.logo:hover { transform: rotate(90deg) scale(1.06); }

.navbtn {
  width: 46px;
  height: 46px;
  border: 0;
  border-radius: 13px;
  background: transparent;
  color: var(--muted);
  font-size: 18px;
  cursor: pointer;
  position: relative;
  transition: all 0.25s var(--ease-spring);
}
.navbtn:hover {
  background: rgba(37, 99, 235, 0.08);
  color: var(--accent);
  transform: translateY(-2px);
}
.navbtn.active {
  background: rgba(37, 99, 235, 0.12);
  color: var(--accent);
  box-shadow: inset 0 0 0 1px rgba(37, 99, 235, 0.2);
}
.navbtn.active::before {
  content: '';
  position: absolute;
  left: -15px;
  top: 12px;
  bottom: 12px;
  width: 4px;
  border-radius: 0 4px 4px 0;
  background: var(--accent);
}

.sidebar-bottom { margin-top: auto; }
.main { margin-left: 76px; width: calc(100% - 76px); padding: 24px 30px; }

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 16px;
  margin-bottom: 26px;
}

.brand { display: flex; align-items: center; gap: 14px; }
.brand-icon {
  width: 46px;
  height: 46px;
  border-radius: 14px;
  display: grid;
  place-items: center;
  background: #ffffff;
  border: 1px solid var(--line);
  font-size: 20px;
  box-shadow: 0 4px 12px rgba(15, 23, 42, 0.04);
}
.brand h1 {
  margin: 0;
  color: var(--text);
  font-size: 19px;
  font-weight: 800;
  letter-spacing: -0.02em;
}
.brand small {
  display: block;
  color: var(--muted);
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.06em;
  margin-top: 3px;
}

.status-area { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.pill {
  border: 1px solid var(--line);
  background: #ffffff;
  border-radius: 99px;
  padding: 8px 14px;
  color: var(--text);
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 500;
  box-shadow: 0 2px 6px rgba(15, 23, 42, 0.03);
  display: inline-flex;
  align-items: center;
  gap: 7px;
}

.dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #10b981;
  box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
  animation: liveBeacon 2s infinite;
}
@keyframes liveBeacon {
  0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.65); }
  70% { box-shadow: 0 0 0 7px rgba(16, 185, 129, 0); }
  100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
}

.primary {
  border: 0;
  background: linear-gradient(135deg, #2563eb, #1d4ed8);
  color: #ffffff;
  border-radius: 10px;
  padding: 10px 16px;
  font-family: var(--font-ui);
  font-weight: 600;
  font-size: 12px;
  letter-spacing: -0.01em;
  box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3);
  cursor: pointer;
  transition: all 0.25s var(--ease-spring);
}
.primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(37, 99, 235, 0.4);
}
.primary:active { transform: translateY(0) scale(0.98); }

.secondary {
  border: 1px solid var(--line-strong);
  background: #ffffff;
  color: var(--text);
  border-radius: 10px;
  padding: 9px 14px;
  font-family: var(--font-ui);
  font-weight: 600;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.2s var(--ease-spring);
}
.secondary:hover { background: #f8fafc; transform: translateY(-1px); }

.danger {
  border: 1px solid rgba(220, 38, 38, 0.2);
  background: #fef2f2;
  color: #dc2626;
  border-radius: 10px;
  padding: 9px 14px;
  font-family: var(--font-ui);
  font-weight: 600;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.2s var(--ease-spring);
}
.danger:hover { background: #fee2e2; transform: translateY(-1px); }

.page { display: none; }
.page.active {
  display: block;
  animation: pageEnter 0.45s var(--ease-spring) forwards;
}
@keyframes pageEnter {
  from { opacity: 0; transform: translateY(12px) scale(0.99); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.page-heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 22px;
}
.page-heading h2 {
  font-size: 22
